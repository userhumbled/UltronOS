<div class="app-explorer">
                    <div class="explorer-sidebar">
                        <div class="sidebar-header">Quick Access</div>
                        <div class="sidebar-item active" data-cat="Root (C:)" onclick="document.getElementById('${containerId}')._changeCategory('Root (C:)', this)">
                            ${SVGS.folder}
                            <span>Root (C:)</span>
                        </div>
                        <div class="sidebar-item" data-cat="Desktop" onclick="document.getElementById('${containerId}')._changeCategory('Desktop', this)">
                            ${SVGS.folder}
                            <span>Desktop</span>
                        </div>
                        <div class="sidebar-item" data-cat="Downloads" onclick="document.getElementById('${containerId}')._changeCategory('Downloads', this)">
                            ${SVGS.folder}
                            <span>Downloads</span>
                        </div>
                        <div class="sidebar-item" data-cat="Documents" onclick="document.getElementById('${containerId}')._changeCategory('Documents', this)">
                            ${SVGS.folder}
                            <span>Documents</span>
                        </div>
                        <div class="sidebar-item" data-cat="Images" onclick="document.getElementById('${containerId}')._changeCategory('Images', this)">
                            ${SVGS.folder}
                            <span>Images</span>
                        </div>
                        <div class="sidebar-item" data-cat="Music" onclick="document.getElementById('${containerId}')._changeCategory('Music', this)">
                            ${SVGS.folder}
                            <span>Music</span>
                        </div>
                        <div class="sidebar-item" data-cat="System" onclick="document.getElementById('${containerId}')._changeCategory('System', this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <span>System</span>
                        </div>
                    </div>
                    <div class="explorer-main">
                        <div class="explorer-header-bar">
                            <div class="explorer-address-bar">
                                <span>Address:</span>&nbsp;<div id="address-path-${containerId}">C:\\</div>
                            </div>
                            <div class="explorer-toolbar">
                                <button onclick="document.getElementById('${containerId}')._newFile()">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                    New File
                                </button>
                                <button onclick="document.getElementById('${containerId}')._newFolder()">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                                    New Folder
                                </button>
                                <button onclick="document.getElementById('${containerId}')._refresh()">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                                    Refresh
                                </button>
                            </div>
                        </div>
                        <div class="explorer-files-area" id="files-area-${containerId}">
                            <div class="explorer-files" id="fs-list-${containerId}"></div>
                        </div>
                    </div>
                </div>
